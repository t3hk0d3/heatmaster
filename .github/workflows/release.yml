name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag, the app manifest and the server package carry one version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' packaging/app/config.yaml)"
          package="$(node -p 'require("./packages/server/package.json").version')"
          echo "tag=$tag manifest=$manifest package=$package"
          [ "$tag" = "$manifest" ] && [ "$tag" = "$package" ]
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Container test
        run: |
          docker build -f packaging/Dockerfile -t heatmaster:release .
          IMAGE=heatmaster:release bash packaging/test/container-test.sh
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/t3hk0d3/heatmaster:${{ steps.version.outputs.version }}
            ghcr.io/t3hk0d3/heatmaster:latest
