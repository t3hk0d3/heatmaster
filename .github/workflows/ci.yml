name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the amd64 image and run the container test
        run: |
          docker build -f packaging/Dockerfile -t heatmaster:ci .
          IMAGE=heatmaster:ci bash packaging/test/container-test.sh
      - name: arm64 smoke check under QEMU
        run: bash packaging/test/container-test.sh arm64
