name: Heatmaster
slug: heatmaster
description: Room schedules and weighted room temperatures for Sonoff radiator valves, through Zigbee2MQTT.
url: https://github.com/t3hk0d3/heatmaster
version: "0.1.0"
image: ghcr.io/t3hk0d3/heatmaster
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_title: Heatmaster
panel_icon: mdi:radiator
services:
  - mqtt:need
homeassistant_api: true
map:
  - type: app_config
    read_only: false
options:
  z2m_base_topic: zigbee2mqtt
  discovery_prefix: homeassistant
schema:
  z2m_base_topic: str
  discovery_prefix: str
